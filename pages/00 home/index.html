<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homepage</title>
    <style>
        
        body {
            margin: 0;
        }

        .container {
            /* block for the div containing all the segments */
            display: flex;
            min-height: 100vh;
        }

        .segments {
            /* block for the segments themself */
            container-type: inline-size;
            flex: 1%;
            margin: 1%;
            border-radius: 50px;
            font-size: 1.5cqw;
            font-family: nasalisation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        } 

    </style>
</head>
<body>

<div class="container">
    <div class="segments" style="background-color: red">
        <!-- about me segment-->
        <!-- the inline <style> is just for testing.-->
        <h1>About me</h1>
        <p>About me page</p>
    </div>
    
    <div class="segments" style="background-color: green">
        <!-- projects segment-->
        <!-- the inline <style> is just for testing.-->
        <h1>Projects</h1>
        <p>My projects page</p>
    </div>
    
    <div class="segments" style="background-color: blue">
        <!-- blog/tbd segment-->
        <!-- the inline <style> is just for testing.-->
        <h1>blog/TBD</h1>
        <p>My Blog/TBD page</p>
    </div>
</div>    

</body>
</html>
